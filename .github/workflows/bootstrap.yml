name: Bootstrap custom-patch

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '기준 릴리스 태그 (비우면 최신 정식 릴리스)'
        required: false
      apply:
        description: '실제 적용. false면 조회만 (dry-run)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: custom-patch
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Setup
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/rustdesk/rustdesk.git
          git fetch --no-tags upstream +refs/heads/master:refs/remotes/upstream/master

      - name: 기준 태그 결정 및 fetch
        id: t
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            if ! RESP=$(gh api repos/rustdesk/rustdesk/releases/latest 2>&1); then
              echo "$RESP"; echo "::error::gh api 실패"; exit 1
            fi
            TAG=$(printf '%s' "$RESP" | jq -r '.tag_name')
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::태그 결정 실패"; exit 1
          fi
          echo "결정된 태그: $TAG"

          # 이 태그 하나만 강제로 받음 (nightly는 손대지 않음)
          git fetch --no-tags upstream "+refs/tags/${TAG}:refs/rd/base"
          echo "커밋: $(git rev-parse --short refs/rd/base^{commit})"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 패치 커밋 탐지
        id: scan
        run: |
          echo "기준 태그   : ${{ steps.t.outputs.tag }}"
          echo "현재 베이스 : $(git merge-base custom-patch upstream/master)"
          echo "--- 내 패치 커밋 ---"
          git log --reverse --no-merges --oneline upstream/master..custom-patch || true
          N=$(git log --reverse --no-merges --pretty=%H upstream/master..custom-patch | wc -l)
          echo "총 ${N}개"
          echo "count=$N" >> "$GITHUB_OUTPUT"

      - name: dry-run 종료 안내
        if: inputs.apply != true
        run: echo "== dry-run 완료. 위 목록이 맞으면 apply 체크하고 재실행 =="

      - name: 재작성 및 push
        if: inputs.apply == true
        run: |
          set -euo pipefail
          if [ "${{ steps.scan.outputs.count }}" -eq 0 ]; then
            echo "::error::패치 커밋이 0개. 중단."; exit 1
          fi
          mapfile -t SHAS < <(git log --reverse --no-merges --pretty=%H upstream/master..custom-patch)

          BK="backup/custom-patch-$(date +%Y%m%d-%H%M%S)"
          git branch "$BK"
          git checkout -B custom-patch refs/rd/base

          for S in "${SHAS[@]}"; do
            if ! git cherry-pick -x "$S"; then
              if git diff --cached --quiet && git diff --quiet; then
                echo "이미 반영됨 → skip: $S"
                git cherry-pick --skip
              else
                git cherry-pick --abort
                echo "::error::cherry-pick conflict at $S"; exit 1
              fi
            fi
          done

          git tag -f upstream-base refs/rd/base^{commit}
          git push -f origin custom-patch upstream-base "$BK"
